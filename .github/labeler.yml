# GitHub PR Labeler Configuration for hemorroidabot
# This file automatically labels pull requests based on the files changed

frontend:
  - 'src/**'
  - '*.html'
  - 'favicons/**'

backend:
  - 'server.js'

tests:
  - 'test/**'
  - '**/*.test.js'

documentation:
  - 'README.md'
  - '*.md'

config:
  - 'package.json'
  - 'package-lock.json'
  - '.gitignore'
  - '.github/**'

dependencies:
  - 'package.json'
  - 'package-lock.json'

tools:
  - 'tools/**'

vendor:
  - 'vendor/**'
