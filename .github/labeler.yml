# GitHub PR Labeler Configuration for hemorroidabot
# This file automatically labels pull requests based on the files changed

frontend:
  - any:
    - 'src/**'
    - '*.html'
    - 'favicons/**'

backend:
  - 'server.js'

tests:
  - any:
    - 'test/**'
    - '**/*.test.js'

documentation:
  - 'README.md'
  - '*.md'

config:
  - any:
    - 'package.json'
    - 'package-lock.json'
    - '.gitignore'
    - '.github/**'

dependencies:
  - any:
    - 'package.json'
    - 'package-lock.json'

tools:
  - 'tools/**'

vendor:
  - 'vendor/**'
