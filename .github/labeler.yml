# GitHub PR Labeler Configuration for hemorroidabot (actions/labeler@v4)

frontend:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/**/*'
          - '*.html'
          - 'favicons/**/*'

backend:
  - changed-files:
      - any-glob-to-any-file:
          - 'server.js'

tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'test/**/*'
          - '**/*.test.js'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'README.md'
          - '*.md'

config:
  - changed-files:
      - any-glob-to-any-file:
          - 'package.json'
          - 'package-lock.json'
          - '.gitignore'
          - '.github/**/*'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'package.json'
          - 'package-lock.json'

tools:
  - changed-files:
      - any-glob-to-any-file:
          - 'tools/**/*'

vendor:
  - changed-files:
      - any-glob-to-any-file:
          - 'vendor/**/*'
