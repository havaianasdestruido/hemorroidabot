# GitHub PR Labeler Configuration for hemorroidabot (actions/labeler@v4)

frontend:
  - 'src/**/*'
  - '*.html'
  - 'favicons/**/*'

backend:
  - 'server.js'

tests:
  - 'test/**/*'
  - '**/*.test.js'

documentation:
  - 'README.md'
  - '*.md'

config:
  - 'package.json'
  - 'package-lock.json'
  - '.gitignore'
  - '.github/**/*'

dependencies:
  - 'package.json'
  - 'package-lock.json'

tools:
  - 'tools/**/*'

vendor:
  - 'vendor/**/*'
