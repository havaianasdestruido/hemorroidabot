name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Run test suite
        run: npm test
      - name: Syntax check (browser JS)
        run: |
          node --check src/app.js
          node --check src/brain.js
          node --check src/models.js
          node --check server.js
          node --input-type=module --check < src/engine.js