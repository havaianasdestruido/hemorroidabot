<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HemorróidaBot</title>
    <link rel="icon" type="image/png" href="favicons/emoji.png">
    <style>
        body { max-width: 640px; margin: 0 auto; padding: 20px; font-family: monospace; }
        h1 { font-size: 1.8em; }
        h2 { font-size: 1.2em; }
        textarea { width: 100%; }
        select, input { width: 100%; box-sizing: border-box; }
        #language-select { width: auto; }
        pre { white-space: pre-wrap; }
        .row { display: flex; gap: 6px; flex-wrap: wrap; }
        .rec { color: #c00; font-weight: bold; }
        #perf { font-size: 0.8em; }
        .toolchain { margin: 4px 0 6px 0; padding: 6px 8px; border-left: 2px solid #999; background: #f3f3f3; font-size: 0.85em; color: #666; }
        .toolchain-step { display: flex; align-items: center; gap: 6px; padding: 1px 0; }
        .toolchain-icon { width: 14px; height: 14px; flex-shrink: 0; }
        .toolchain-label { color: #777; }
        .msg-meta { color: #999; font-size: 0.75em; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="row"><h1>HemorróidaBot</h1><label for="language-select" data-i18n="language.label">Idioma</label><select id="language-select" aria-label="Idioma"><option value="pt-BR" data-i18n="language.pt">Portugues (Brasil)</option><option value="en-US" data-i18n="language.en">English (US)</option></select></div>
    <p data-i18n="app.tagline">MEGABRAIN local so com JS no front-end.</p>

    <form id="main-form" onsubmit="return false;">
        <fieldset>
            <legend data-i18n="model.legend">Modelo</legend>
            <select id="model-select">
                <option value="qwen-3b">Qwen 2.5 3B</option>
                <option value="qwen-7b">Qwen 2.5 7B</option>
                <option value="llama-3.2">Llama 3.2 3B</option>
                <option value="gemma-3">Gemma 3 4B</option>
            </select>
        </fieldset>

        <fieldset>
            <legend data-i18n="download.legend">Baixar modelo do HuggingFace</legend>
            <label for="repo-input" data-i18n="download.repo">Repo (revisao main):</label>
            <input id="repo-input" type="text" placeholder="autor/modelo-GGUF" data-i18n-placeholder="download.repoPlaceholder">
            <label for="file-input" data-i18n="download.file">Arquivo:</label>
            <input id="file-input" type="text" placeholder="modelo-q4_k_m.gguf" data-i18n-placeholder="download.filePlaceholder">
            <br><br>
            <div class="row">
                <button type="button" id="list-btn" data-i18n="download.list">Listar arquivos</button>
                <button type="button" id="dl-btn" data-i18n="download.download">Baixar e cachear</button>
                <button type="button" id="cache-btn" data-i18n="download.cache">Ver cache</button>
                <button type="button" id="load-engine-btn" data-i18n="download.load">Carregar modelo local</button>
                <button type="button" id="unload-btn" data-i18n="download.unload">Descarregar</button>
            </div>
            <p id="dl-status"></p>
            <progress id="dl-progress" max="100" value="0" style="display:none;width:100%"></progress>
            <div id="file-list"></div>
        </fieldset>

        <fieldset>
            <legend data-i18n="voice.legend">Entrada / Voz</legend>
            <div class="row">
                <label><input type="radio" name="mode" value="text" checked> <span data-i18n="voice.text">Texto</span></label>
                <label><input type="radio" name="mode" value="voice"> <span data-i18n="voice.voice">Voz</span></label>
            </div>
            <div class="row">
                <button type="button" id="mic-btn" disabled data-i18n="voice.dictate">🎤 Ditar</button>
                <label><input type="checkbox" id="tts-chk"> <span data-i18n="voice.tts">Falar resposta (TTS)</span></label>
            </div>
        </fieldset>

        <fieldset>
            <legend data-i18n="performance.legend">Desempenho</legend>
            <div id="perf" data-i18n="performance.empty">Sem dados. Envie uma mensagem com um modelo carregado.</div>
        </fieldset>

        <fieldset>
            <legend data-i18n="chat.legend">Chat</legend>
            <div class="row">
                <button type="button" id="clear-btn" data-i18n="chat.clear">Limpar historico</button>
            </div>
            <div id="messages"></div>
        </fieldset>

        <fieldset>
            <legend data-i18n="message.legend">Mensagem</legend>
            <label for="user-input" data-i18n="message.label">Digite ou dite:</label>
            <textarea id="user-input" rows="3" placeholder="Sua mensagem..." data-i18n-placeholder="message.placeholder"></textarea>
            <br>
            <button type="button" id="send-btn" onclick="sendMessage()" data-i18n="message.send">Enviar</button>
        </fieldset>
    </form>

    <fieldset>
        <legend data-i18n="tools.legend">Ferramentas locais</legend>
        <div id="tools-grid"></div>
        <div class="tool-opt-line">
            <label>
                <input type="checkbox" id="dead-api-toggle">
                <span data-i18n="tools.dead">Habilitar APIs mortas/offline (desativado por padrao)</span>
            </label>
        </div>
    </fieldset>

    <script src="src/i18n.js"></script>
    <script src="src/models.js"></script>
    <script src="src/brain.js"></script>
    <script src="src/app.js"></script>
    <script type="module" src="src/engine.js"></script>
</body>
</html>
