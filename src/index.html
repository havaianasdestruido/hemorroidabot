<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HemorróidaBot</title>
    <style>
        body { max-width: 640px; margin: 0 auto; padding: 20px; font-family: monospace; }
        h1 { font-size: 1.8em; }
        h2 { font-size: 1.2em; }
        textarea { width: 100%; }
        select, input { width: 100%; box-sizing: border-box; }
        pre { white-space: pre-wrap; }
        .row { display: flex; gap: 6px; flex-wrap: wrap; }
        .rec { color: #c00; font-weight: bold; }
        #perf { font-size: 0.8em; }
    </style>
</head>
<body>

    <h1>HemorróidaBot</h1>
    <p>MEGABRAIN local so com JS no front-end.</p>

    <form id="main-form" onsubmit="return false;">
        <fieldset>
            <legend>Modelo</legend>
            <select id="model-select">
                <option value="qwen-3b">Qwen 2.5 3B</option>
                <option value="qwen-7b">Qwen 2.5 7B</option>
                <option value="llama-3.2">Llama 3.2 3B</option>
                <option value="gemma-3">Gemma 3 4B</option>
            </select>
        </fieldset>

        <fieldset>
            <legend>Baixar modelo do HuggingFace</legend>
            <label for="repo-input">Repo (revisao main):</label>
            <input id="repo-input" type="text" placeholder="autor/modelo-GGUF">
            <label for="file-input">Arquivo:</label>
            <input id="file-input" type="text" placeholder="modelo-q4_k_m.gguf">
            <br><br>
            <div class="row">
                <button type="button" id="list-btn">Listar arquivos</button>
                <button type="button" id="dl-btn">Baixar e cachear</button>
                <button type="button" id="cache-btn">Ver cache</button>
                <button type="button" id="load-engine-btn">Carregar modelo local</button>
                <button type="button" id="unload-btn">Descarregar</button>
            </div>
            <p id="dl-status"></p>
            <progress id="dl-progress" max="100" value="0" style="display:none;width:100%"></progress>
            <div id="file-list"></div>
        </fieldset>

        <fieldset>
            <legend>Entrada / Voz</legend>
            <div class="row">
                <label><input type="radio" name="mode" value="text" checked> Texto</label>
                <label><input type="radio" name="mode" value="voice"> Voz</label>
            </div>
            <div class="row">
                <button type="button" id="mic-btn" disabled>🎤 Ditar</button>
                <label><input type="checkbox" id="tts-chk"> Falar resposta (TTS)</label>
            </div>
        </fieldset>

        <fieldset>
            <legend>Desempenho</legend>
            <div id="perf">Sem dados. Envie uma mensagem com um modelo carregado.</div>
        </fieldset>

        <fieldset>
            <legend>Chat</legend>
            <div class="row">
                <button type="button" id="clear-btn">Limpar historico</button>
            </div>
            <div id="messages"></div>
        </fieldset>

        <fieldset>
            <legend>Mensagem</legend>
            <label for="user-input">Digite ou dite:</label>
            <textarea id="user-input" rows="3" placeholder="Sua mensagem..."></textarea>
            <br>
            <button type="button" id="send-btn" onclick="sendMessage()">Enviar</button>
        </fieldset>
    </form>

    <fieldset>
        <legend>Ferramentas locais</legend>
        <div id="tools-grid"></div>
    </fieldset>

    <script src="src/models.js"></script>
    <script src="src/brain.js"></script>
    <script src="src/app.js"></script>
    <script type="module" src="src/engine.js"></script>
</body>
</html>
