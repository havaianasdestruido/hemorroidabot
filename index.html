<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HemorróidaBot</title>
</head>
<body>
    <h1>HemorróidaBot</h1>
    <p>MEGABRAIN local com JS puro</p>

    <h2>Modelo</h2>
    <select id="model-select">
        <option value="qwen-3b">Qwen 2.5 3B</option>
        <option value="qwen-7b">Qwen 2.5 7B</option>
        <option value="llama-3.2-3b">Llama 3.2 3B</option>
        <option value="gemma-4b">Gemma 3 4B</option>
    </select>

    <h2>Entrada</h2>
    <button id="btn-text" onclick="setMode('text')">Texto</button>
    <button id="btn-voice" onclick="setMode('voice')">Voz</button>

    <h2>Chat</h2>
    <div id="messages"></div>

    <h2>Mensagem</h2>
    <textarea id="user-input" rows="3" cols="50" placeholder="Digite sua mensagem..."></textarea>
    <br>
    <button id="send-btn" onclick="sendMessage()">Enviar</button>

    <h2>Ferramentas</h2>
    <div id="tools-grid"></div>

    <script src="app.js"></script>
</body>
</html>
